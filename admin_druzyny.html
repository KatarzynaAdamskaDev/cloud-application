<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Admin - Drużyny</title>
<style>
 body { font-family:sans-serif; background:#f4f4f4; margin:0; }
 nav { background:#0078D4; color:white; padding:10px 20px; }
 nav a { color:white; margin-right:15px; text-decoration:none; }
 table { width:80%; margin:20px auto; border-collapse:collapse; background:white; }
 th, td { border:1px solid #ddd; padding:8px; text-align:center; }
 tr:nth-child(even){background:#f9f9f9;}
 form { margin:20px auto; width:80%; background:white; padding:15px; border-radius:8px; }
 input { padding:5px; margin:5px; }
 button { padding:6px 12px; }
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Strona główna</a>
    <a href="{{ url_for('admin_panel') }}">Użytkownicy</a>
    <a href="{{ url_for('admin_druzyny') }}">Drużyny</a>
    <a href="{{ url_for('admin_zawodnicy') }}">Zawodnicy</a>
    <a href="{{ url_for('admin_mecze') }}">Mecze</a>
    <a href="{{ url_for('admin_gole') }}">Gole</a>
    <a href="{{ url_for('logout') }}">Wyloguj</a>
</nav>

<h2 style="text-align:center;">Zarządzanie drużynami</h2>

<form method="POST">
    <b>Dodaj drużynę:</b><br>
    Nazwa: <input type="text" name="nazwa" required>
    Miasto: <input type="text" name="miasto" required>
    Punkty: <input type="number" name="punkty" value="0">
    <button type="submit">Dodaj</button>
</form>

<table>
<tr><th>ID</th><th>Nazwa</th><th>Miasto</th><th>Punkty</th><th>Akcje</th></tr>
{% for t in teams %}
<tr>
    <td>{{ t[0] }}</td>
    <td>{{ t[1] }}</td>
    <td>{{ t[2] }}</td>
    <td>{{ t[3] }}</td>
    <td><a href="{{ url_for('admin_druzyna_delete', team_id=t[0]) }}">Usuń</a></td>
</tr>
{% else %}
<tr><td colspan="5">Brak drużyn.</td></tr>
{% endfor %}
</table>
</body>
</html>
