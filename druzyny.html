<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Drużyny</title>
<style>
 body { font-family: sans-serif; background:#f4f4f4; margin:0; }
 nav { background:#0078D4; color:white; padding:10px 20px; }
 nav a { color:white; margin-right:15px; text-decoration:none; }
 table { width:80%; margin:20px auto; border-collapse:collapse; background:white; }
 th, td { border:1px solid #ddd; padding:10px; text-align:center; }
 tr:nth-child(even){background:#f9f9f9;}
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Strona główna</a>
    <a href="{{ url_for('zawodnicy_list') }}">Zawodnicy</a>
    <a href="{{ url_for('mecze_list') }}">Mecze</a>
</nav>

<h2 style="text-align:center;">Lista drużyn</h2>
<table>
<tr><th>Nazwa</th><th>Miasto</th><th>Punkty</th><th>Szczegóły</th></tr>
{% for t in teams %}
<tr>
    <td>{{ t[1] }}</td>
    <td>{{ t[2] }}</td>
    <td>{{ t[3] }}</td>
    <td><a href="{{ url_for('druzyna_detail', team_id=t[0]) }}">Pokaż zespół</a></td>
</tr>
{% endfor %}
</table>
</body>
</html>
