<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie – System Liga</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="nav-main">
    <div class="nav-left">
        <span class="logo">⚽ LIGA</span>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('index') }}">Strona główna</a>
        <a href="{{ url_for('register') }}">Rejestracja</a>
    </div>
</nav>

<div class="container">

    <div class="profile-box">
        <h2>Logowanie</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="flash flash-{{cat}}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Login:</label>
            <input type="text" name="login" required>

            <label>Hasło:</label>
            <input type="password" name="password" required>

            <button class="btn" type="submit">Zaloguj</button>
        </form>

        <p>Nie masz konta?  
            <a href="{{ url_for('register') }}">Zarejestruj się</a>
        </p>
    </div>

</div>

</body>
</html>
