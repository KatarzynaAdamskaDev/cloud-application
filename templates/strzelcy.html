<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Klasyfikacja strzelców</title>
<style>
    body { font-family: Arial; background:#f4f4f4; margin:0; }
    nav { background:#0078D4; padding:10px 20px; color:white; }
    nav a { color:white; margin-right:15px; text-decoration:none; }
    table { width: 80%; margin: 20px auto; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align:center; }
    tr:nth-child(even) { background-color: #f9f9f9; }
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Strona główna</a>
    <a href="{{ url_for('zawodnicy_list') }}">Zawodnicy</a>
</nav>

<h2 style="text-align:center;">Klasyfikacja strzelców</h2>

<table>
    <tr>
        <th>#</th>
        <th>Zawodnik</th>
        <th>Drużyna</th>
        <th>Gole</th>
    </tr>
    {% for r in rows %}
    <tr>
        <td>{{ loop.index }}</td>
        <td>{{ r[0] }} {{ r[1] }}</td>
        <td>{{ r[2] }}</td>
        <td>{{ r[3] }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
