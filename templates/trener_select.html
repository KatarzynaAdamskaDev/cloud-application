<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybór drużyny – Panel trenera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="nav-main">
    <div class="nav-left">
        <span class="logo">⚽ LIGA</span>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('index') }}">Strona główna</a>
        <a class="nav-highlight" href="{{ url_for('trener_select') }}">Panel trenera</a>

        {% if session.get('rola') == 'Administrator' %}
            <a class="nav-highlight" href="{{ url_for('admin_panel') }}">Admin</a>
        {% endif %}

        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </div>
</nav>

<div class="container">

    <h2>Wybierz drużynę do analizy</h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Drużyna</th>
                    <th>Analiza</th>
                </tr>
            </thead>

            <tbody>
                {% for t in teams %}
                <tr>
                    <td>{{ t[1] }}</td>
                    <td>
                        <a class="btn" href="{{ url_for('trener_view', team_id=t[0]) }}">
                            Otwórz raport
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2">Brak drużyn w systemie.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
