<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wszystkie mecze</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<nav>
    <div>
        <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Strona główna</a>
        <a href="{{ url_for('druzyny_list') }}"><i class="fa-solid fa-people-group"></i> Drużyny</a>
        <a href="{{ url_for('zawodnicy_list') }}"><i class="fa-solid fa-person-running"></i> Zawodnicy</a>
    </div>
</nav>

<div class="container">
    <h2 style="text-align:center; color:var(--primary-dark);">
        <i class="fa-solid fa-futbol"></i> Wszystkie mecze
    </h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Gospodarz</th>
                    <th>Wynik</th>
                    <th>Gość</th>
                    <th>Szczegóły</th>
                </tr>
            </thead>
            <tbody>
                {% for m in matches %}
                <tr>
                    <td>{{ m[0] }}</td>
                    <td>{{ m[1] }}</td>
                    <td>{{ m[2] }}</td>
                    <td>{{ m[4] }} : {{ m[5] }}</td>
                    <td>{{ m[3] }}</td>
                    <td>
                        <a class="btn" href="{{ url_for('mecz_detail', mecz_id=m[0]) }}">
                            <i class="fa-solid fa-circle-info"></i> Szczegóły
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="6">Brak meczów.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<footer>© 2026 System Liga</footer>

</body>
</html>
