<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Drużyny</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<nav>
    <div>
        <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Strona główna</a>
        <a href="{{ url_for('zawodnicy_list') }}"><i class="fa-solid fa-person-running"></i> Zawodnicy</a>
        <a href="{{ url_for('mecze_list') }}"><i class="fa-solid fa-futbol"></i> Mecze</a>
    </div>
</nav>

<div class="container">
    <h2 style="text-align:center; color:var(--primary-dark);">
        <i class="fa-solid fa-people-group"></i> Lista drużyn
    </h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Nazwa</th>
                    <th>Miasto</th>
                    <th>Punkty</th>
                    <th>Szczegóły</th>
                </tr>
            </thead>
            <tbody>
                {% for t in teams %}
                <tr>
                    <td>{{ t[1] }}</td>
                    <td>{{ t[2] }}</td>
                    <td><b>{{ t[3] }}</b></td>
                    <td>
                        <a class="btn" href="{{ url_for('druzyna_detail', team_id=t[0]) }}">
                            <i class="fa-solid fa-circle-info"></i> Pokaż
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<footer>© 2026 System Liga</footer>

</body>
</html>
