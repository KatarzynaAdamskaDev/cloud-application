<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Profil zawodnika</title>
<style>
 body { font-family:sans-serif; background:#f4f4f4; margin:0; }
 nav { background:#0078D4; color:white; padding:10px 20px; }
 nav a { color:white; margin-right:15px; text-decoration:none; }
 .box { max-width:600px; margin:30px auto; background:white; padding:20px; border-radius:8px; }
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Strona główna</a>
    <a href="{{ url_for('zawodnicy_list') }}">Zawodnicy</a>
</nav>

<div class="box">
    {% if player %}
        <h2>{{ player[1] }} {{ player[2] }}</h2>
        <p>Pozycja: <b>{{ player[3] }}</b></p>
        <p>Drużyna: <b>{{ player[4] }}</b></p>
        <p>Gole: <b>{{ stats.gole }}</b></p>
    {% else %}
        <p>Nie znaleziono zawodnika.</p>
    {% endif %}
</div>
</body>
</html>
