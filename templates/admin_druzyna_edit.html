<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Edytuj drużynę</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav>
    <div>
        <a href="{{ url_for('admin_druzyny') }}"><i class="fa-solid fa-arrow-left"></i> Powrót</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:500px; margin:auto;">
        <h2><i class="fa-solid fa-pen-to-square"></i> Edytuj drużynę</h2>
        <form method="POST">
            Nazwa:
            <input type="text" name="nazwa" value="{{ team[1] }}" required>
            Miasto:
            <input type="text" name="miasto" value="{{ team[2] }}" required>
            Punkty:
            <input type="number" name="punkty" value="{{ team[3] }}" required>
            <button type="submit">Zapisz</button>
        </form>
    </div>
</div>

<footer>© 2026 System Liga – Edycja drużyny</footer>

</body>
</html>
