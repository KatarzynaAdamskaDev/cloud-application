<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel administratora – Użytkownicy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="nav-main">
    <div class="nav-left">
        <span class="logo">⚽ LIGA – ADMIN</span>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('index') }}">Strona główna</a>
        <a class="nav-highlight" href="{{ url_for('admin_panel') }}">Panel admina</a>
        <a href="{{ url_for('admin_druzyny') }}">Drużyny</a>
        <a href="{{ url_for('admin_zawodnicy') }}">Zawodnicy</a>
        <a href="{{ url_for('admin_mecze') }}">Mecze</a>
        <a href="{{ url_for('admin_gole') }}">Gole</a>
        <a href="{{ url_for('admin_raport_spojnosc') }}">Raport spójności</a>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </div>
</nav>

<div class="container">

    <h2>Zarządzanie użytkownikami</h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Login</th>
                    <th>Rola</th>
                    <th>Akcje</th>
                </tr>
            </thead>

            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td><b>{{ user[2] }}</b></td>
                    <td>
                        <a class="btn-warning btn" href="{{ url_for('promote', uid=user[0], role='Trener') }}">Nadaj Trenera</a>
                        <a class="btn" href="{{ url_for('promote', uid=user[0], role='Uzytkownik') }}">Użytkownik</a>
                        <a class="btn" href="{{ url_for('promote', uid=user[0], role='Administrator') }}">Administrator</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
