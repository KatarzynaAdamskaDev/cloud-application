<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel Administratora</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav>
    <div>
        <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Strona główna</a>
    </div>
    <div>
        <a href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj</a>
    </div>
</nav>

<div class="container">
    <h1 style="text-align:center; color:var(--primary-dark);">
        <i class="fa-solid fa-user-gear"></i> Zarządzanie użytkownikami
    </h1>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Login</th>
                    <th>Rola</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td><b>{{ user[2] }}</b></td>
                    <td>
                        <a href="{{ url_for('promote', uid=user[0], role='Trener') }}" class="btn" style="background:#f39c12">
                            Daj Trenera
                        </a>
                        <a href="{{ url_for('promote', uid=user[0], role='Uzytkownik') }}" class="btn" style="background:#7f8c8d">
                            Zdejmij
                        </a>
                        <a href="{{ url_for('promote', uid=user[0], role='Administrator') }}" class="btn" style="background:var(--primary)">
                            Admin
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<footer>© 2026 System Liga – Panel administratora</footer>

</body>
</html>
