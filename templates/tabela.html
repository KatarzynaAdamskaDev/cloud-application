<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tabela ligowa</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<nav>
    <div>
        <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Strona główna</a>
    </div>
</nav>

<div class="container">
    <h2 style="text-align:center; color:var(--primary-dark);">
        <i class="fa-solid fa-ranking-star"></i> Tabela ligowa
    </h2>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Pozycja</th>
                    <th>Drużyna</th>
                    <th>Miasto</th>
                    <th>Punkty</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ r[1] }}</td>
                    <td>{{ r[2] }}</td>
                    <td><b>{{ r[3] }}</b></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<footer>© 2026 System Liga</footer>

</body>
</html>
