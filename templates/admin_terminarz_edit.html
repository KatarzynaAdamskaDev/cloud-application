<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj terminarz</title>
</head>
<body>
    <h1>Edytuj terminarz</h1>

    <p>
        <a href="{{ url_for('admin_terminarze') }}">Powrót do terminarzy</a>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p><strong>{{ message }}</strong></p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <p>
            <label>Nazwa sezonu:</label><br>
            <input type="text" name="nazwa_sezonu" value="{{ terminarz[1] }}" required>
        </p>

        <p>
            <label>Data rozpoczęcia:</label><br>
            <input type="date" name="data_rozpoczecia" value="{{ terminarz[2] }}" required>
        </p>

        <p>
            <label>Data zakończenia:</label><br>
            <input type="date" name="data_zakonczenia" value="{{ terminarz[3] }}" required>
        </p>

        <p>
            <label>Status:</label><br>
            <select name="status" required>
                <option value="planowany" {% if terminarz[4] == "planowany" %}selected{% endif %}>
                    planowany
                </option>
                <option value="aktywny" {% if terminarz[4] == "aktywny" %}selected{% endif %}>
                    aktywny
                </option>
                <option value="zakończony" {% if terminarz[4] == "zakończony" %}selected{% endif %}>
                    zakończony
                </option>
            </select>
        </p>

        <button type="submit">Zapisz zmiany</button>
    </form>
</body>
</html>
