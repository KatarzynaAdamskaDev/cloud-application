<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj terminarz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="nav-main">
    <div class="nav-left">
        <span class="logo">LIGA</span>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('index') }}">Start</a>
        <a href="{{ url_for('admin_panel') }}">Panel admina</a>
        <a href="{{ url_for('admin_terminarze') }}">Terminarze</a>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </div>
</nav>

<div class="container">

    <h2>Edytuj terminarz</h2>

    <div class="card">
        <form method="POST">
            <label>Nazwa sezonu</label>
            <input type="text" name="nazwa_sezonu" value="{{ terminarz[1] }}" required>

            <label>Data rozpoczęcia</label>
            <input type="date" name="data_rozpoczecia" value="{{ terminarz[2] }}" required>

            <label>Data zakończenia</label>
            <input type="date" name="data_zakonczenia" value="{{ terminarz[3] }}" required>

            <label>Status</label>
            <select name="status" required>
                <option value="planowany" {% if terminarz[4] == "planowany" %}selected{% endif %}>
                    planowany
                </option>
                <option value="aktywny" {% if terminarz[4] == "aktywny" %}selected{% endif %}>
                    aktywny
                </option>
                <option value="zakończony" {% if terminarz[4] == "zakończony" %}selected{% endif %}>
                    zakończony
                </option>
            </select>

            <br><br>

            <button class="btn" type="submit">Zapisz zmiany</button>
            <a class="btn" href="{{ url_for('admin_terminarze') }}">Anuluj</a>
        </form>
    </div>

</div>

</body>
</html>
