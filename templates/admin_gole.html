<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Admin – Gole</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="nav-left">
    <span style="color:white;font-weight:bold;font-size:1.2rem;">LIGA</span>
</div>

<div class="container">

    <h2>Zarządzanie golami</h2>

    <div class="card">
        <h3>Dodaj gola</h3>

        <form method="POST">
            <label>Mecz</label>
            <select name="mecz_id" required>
                {% for m in matches %}
                    <option value="{{ m[0] }}">
                        {{ m[1] }} — {{ m[2] }} vs {{ m[3] }}
                        {% if m[4] is not none and m[5] is not none %}
                            ({{ m[4] }}:{{ m[5] }})
                        {% endif %}
                    </option>
                {% endfor %}
            </select>

            <label>Zawodnik</label>
            <select name="zawodnik_id" required>
                {% for p in players %}
                    <option value="{{ p[0] }}">
                        {{ p[1] }} {{ p[2] }} — {{ p[3] }}
                    </option>
                {% endfor %}
            </select>

            <label>Minuta</label>
            <input type="number" name="minuta" min="1" max="120" required>

            <label>Typ gola</label>
            <select name="typ">
                <option value="normalny">normalny</option>
                <option value="karny">karny</option>
                <option value="samobójczy">samobójczy</option>
            </select>

            <br><br>

            <button class="btn" type="submit">Dodaj gola</button>
        </form>
    </div>

    <div class="card">
        <h3>Lista goli</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mecz</th>
                    <th>Zawodnik</th>
                    <th>Drużyna gola</th>
                    <th>Minuta</th>
                    <th>Typ</th>
                    <th>Akcje</th>
                </tr>
            </thead>

            <tbody>
    {% for g in goals %}
    <tr>
        <td>{{ g[0] }}</td>
        <td>{{ g[2] }} vs {{ g[3] }} ({{ g[1] }})</td>
        <td>{{ g[4] }} {{ g[5] }}</td>
        <td>—</td> <!-- Drużynę gola pomijamy dla uproszczenia błędu -->
        <td>{{ g[6] }}</td>
        <td>{{ g[7] }}</td>
        <td>
            <a class="btn-warning btn" href="{{ url_for('admin_gol_delete', gol_id=g[0]) }}">Usuń</a>
        </td>
    </tr>
    {% endfor %}
</tbody>
        </table>
    </div>

</div>

</body>
</html>
