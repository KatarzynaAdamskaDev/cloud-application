<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Edytuj zawodnika</title>
<style>
 body { font-family:sans-serif; background:#f4f4f4; margin:0; }
 nav { background:#0078D4; color:white; padding:10px 20px; }
 nav a { color:white; margin-right:15px; text-decoration:none; }
 .box { max-width:500px; margin:30px auto; background:white; padding:20px; border-radius:8px; }
 input, select { width:100%; padding:8px; margin:5px 0; }
 button { padding:8px 16px; }
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('admin_zawodnicy') }}">Powrót</a>
</nav>

<div class="box">
    <h2>Edytuj zawodnika</h2>
    <form method="POST">
        Imię:
        <input type="text" name="imie" value="{{ player[1] }}" required>
        Nazwisko:
        <input type="text" name="nazwisko" value="{{ player[2] }}" required>
        Pozycja:
        <input type="text" name="pozycja" value="{{ player[3] }}" required>
        Drużyna:
        <select name="druzyna_id" required>
            {% for t in teams %}
            <option value="{{ t[0] }}" {% if t[0] == player[4] %}selected{% endif %}>{{ t[1] }}</option>
            {% endfor %}
        </select>
        <button type="submit">Zapisz</button>
    </form>
</div>
</body>
</html>
