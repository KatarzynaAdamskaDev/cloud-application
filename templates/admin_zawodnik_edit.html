<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj zawodnika – Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="nav-main">
    <div class="nav-left">
        <span class="logo">⚽ LIGA – ADMIN</span>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('admin_zawodnicy') }}">Powrót</a>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </div>
</nav>

<div class="container">

    <h2>Edytuj zawodnika</h2>

    <div class="card">
        <form method="POST">

            <label>Imię:</label>
            <input type="text" name="imie" value="{{ player[1] }}" required>

            <label>Nazwisko:</label>
            <input type="text" name="nazwisko" value="{{ player[2] }}" required>

            <label>Pozycja:</label>
            <input type="text" name="pozycja" value="{{ player[3] }}" required>

            <label>Drużyna:</label>
            <select name="druzyna_id" required>
                {% for t in teams %}
                <option value="{{ t[0] }}" {% if t[0] == player[4] %}selected{% endif %}>
                    {{ t[1] }}
                </option>
                {% endfor %}
            </select>

            <button class="btn" type="submit">Zapisz zmiany</button>
        </form>
    </div>

</div>

</body>
</html>
