<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Rejestracja</title>
<style>
    body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
    .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
    .flash { color: red; font-size: 0.9em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="box">
    <h2>Rejestracja</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
                <div class="flash">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="login" placeholder="Nowy login" required>
        <input type="password" name="password" placeholder="Nowe hasło" required>
        <button type="submit">Zarejestruj się</button>
    </form>
    <p><a href="{{ url_for('login') }}">Wróć do logowania</a></p>
</div>
</body>
</html>
