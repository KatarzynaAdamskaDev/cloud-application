<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wszystkie mecze</title>
<style>
 body { font-family:sans-serif; background:#f4f4f4; margin:0; }
 nav { background:#0078D4; color:white; padding:10px 20px; }
 nav a { color:white; margin-right:15px; text-decoration:none; }
 table { width:90%; margin:20px auto; border-collapse:collapse; background:white; }
 th, td { border:1px solid #ddd; padding:8px; text-align:center; }
 tr:nth-child(even){background:#f9f9f9;}
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Strona główna</a>
    <a href="{{ url_for('druzyny_list') }}">Drużyny</a>
    <a href="{{ url_for('zawodnicy_list') }}">Zawodnicy</a>
</nav>

<h2 style="text-align:center;">Wszystkie mecze</h2>
<table>
<tr><th>ID</th><th>Data</th><th>Gospodarz</th><th>Wynik</th><th>Gość</th></tr>
{% for m in matches %}
<tr>
    <td>{{ m[0] }}</td>
    <td>{{ m[1] }}</td>
    <td>{{ m[2] }}</td>
    <td>{{ m[4] }} : {{ m[5] }}</td>
    <td>{{ m[3] }}</td>
    <td><a href="{{ url_for('mecz_detail', mecz_id=m[0]) }}">Szczegóły</a></td>
</tr>
{% else %}
<tr><td colspan="5">Brak meczów.</td></tr>
{% endfor %}
</table>
</body>
</html>
